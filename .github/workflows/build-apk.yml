name: Build Daily Helper Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate upload keystore if needed
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "No upload keystore secret found."
            echo "Generating a temporary upload keystore for the first release build."

            keytool -genkeypair \
              -v \
              -keystore upload-keystore.jks \
              -alias dailyhelper \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass DailyHelperTemp123! \
              -keypass DailyHelperTemp123! \
              -dname "CN=Daily Helper, OU=App, O=Daily Helper, L=Qatar, ST=Qatar, C=QA"

            base64 -w 0 upload-keystore.jks > keystore.base64
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          fi

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("../../upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: DailyHelperTemp123!
          KEY_ALIAS: dailyhelper
          KEY_PASSWORD: DailyHelperTemp123!
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: DailyHelperTemp123!
          KEY_ALIAS: dailyhelper
          KEY_PASSWORD: DailyHelperTemp123!
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Play Store AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Helper-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            upload-keystore.jks
            keystore.base64
          if-no-files-found: error
