<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101827">
  <meta name="description" content="Daily Helper - everyday tools, calculators, money tools, time, calendar, notes, expenses, converters, QR tools and 21 languages.">

  <title>Daily Helper</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>DAILY HELPER</h1>
    <p>Everything you need for everyday life</p>
  </header>

  <div class="language-bar">
    <select id="languageSelect">
      <option value="en">🇬🇧 English</option>
      <option value="hi">🇮🇳 हिन्दी</option>
      <option value="ne">🇳🇵 नेपाली</option>
      <option value="ar">🇸🇦 العربية</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="ta">🇮🇳 தமிழ்</option>
      <option value="ms">🇲🇾 Melayu</option>
      <option value="id">🇮🇩 Indonesia</option>
      <option value="th">🇹🇭 ไทย</option>
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="tl">🇵🇭 Filipino</option>
      <option value="bn">🇧🇩 বাংলা</option>
      <option value="ur">🇵🇰 اردو</option>
      <option value="te">🇮🇳 తెలుగు</option>
      <option value="mr">🇮🇳 मराठी</option>
      <option value="gu">🇮🇳 ગુજરાતી</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
  </div>

  <div class="ad-space">
    Advertisement
  </div>

  <main>

    <section class="welcome">
      <h2 id="welcomeTitle">Welcome to Daily Helper 👋</h2>
      <p id="welcomeText">
        Useful everyday tools in one simple app.
      </p>
    </section>

    <h2 class="tools-title" id="toolsTitle">All Tools</h2>

    <section class="tools-grid">

      <button class="tool" data-tool="money">
        <div class="icon">💰</div>
        <div class="name">Money</div>
        <div class="desc">Salary & finance</div>
      </button>

      <button class="tool" data-tool="calculator">
        <div class="icon">🧮</div>
        <div class="name">Calculator</div>
        <div class="desc">Everyday calculations</div>
      </button>

      <button class="tool" data-tool="loan">
        <div class="icon">🏠</div>
        <div class="name">Home Loan</div>
        <div class="desc">Loan & EMI</div>
      </button>

      <button class="tool" data-tool="time">
        <div class="icon">⏰</div>
        <div class="name">Time</div>
        <div class="desc">Alarm & timer</div>
      </button>

      <button class="tool" data-tool="calendar">
        <div class="icon">📅</div>
        <div class="name">Calendar</div>
        <div class="desc">Dates & planning</div>
      </button>

      <button class="tool" data-tool="notes">
        <div class="icon">📝</div>
        <div class="name">Notes</div>
        <div class="desc">Save your notes</div>
      </button>

      <button class="tool" data-tool="todo">
        <div class="icon">✅</div>
        <div class="name">To-Do</div>
        <div class="desc">Daily tasks</div>
      </button>

      <button class="tool" data-tool="expenses">
        <div class="icon">💸</div>
        <div class="name">Expenses</div>
        <div class="desc">Track spending</div>
      </button>

      <button class="tool" data-tool="currency">
        <div class="icon">💱</div>
        <div class="name">Currency</div>
        <div class="desc">Exchange converter</div>
      </button>

      <button class="tool" data-tool="converter">
        <div class="icon">📏</div>
        <div class="name">Converter</div>
        <div class="desc">Units & measurements</div>
      </button>

      <button class="tool" data-tool="age">
        <div class="icon">🎂</div>
        <div class="name">Age Calculator</div>
        <div class="desc">Calculate your age</div>
      </button>

      <button class="tool" data-tool="percentage">
        <div class="icon">📊</div>
        <div class="name">Percentage</div>
        <div class="desc">Percent calculations</div>
      </button>

      <button class="tool" data-tool="bill">
        <div class="icon">🧾</div>
        <div class="name">Bill Split</div>
        <div class="desc">Split bills easily</div>
      </button>

      <button class="tool" data-tool="qr">
        <div class="icon">🔳</div>
        <div class="name">QR Tools</div>
        <div class="desc">Create & scan QR</div>
      </button>

      <button class="tool" data-tool="language">
        <div class="icon">🌍</div>
        <div class="name">Languages</div>
        <div class="desc">21 languages</div>
      </button>

      <button class="tool" data-tool="settings">
        <div class="icon">⚙️</div>
        <div class="name">Settings</div>
        <div class="desc">App settings</div>
      </button>

    </section>

  </main>

  <footer>
    Daily Helper © 2026
  </footer>

  <script src="app.js"></script>

</body>
</html>
